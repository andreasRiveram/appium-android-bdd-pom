name: Appium Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de Cucumber a ejecutar (ej: @smoke, @regression)'
        required: true
        default: '@smoke'
        type: string

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Habilitar KVM (aceleración de hardware)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Levantar emulador y ejecutar tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb wait-for-device
            adb devices
            npm install -g appium
            appium driver install uiautomator2
            appium --allow-insecure=uiautomator2:adb_shell &
            APPIUM_PID=$!
            sleep 10
            npx wdio run wdio.conf.js --cucumberOpts.tagExpression="${{ github.event.inputs.tag || '@smoke' }}"
            kill $APPIUM_PID || true

      - name: Verificar resultados de Allure
        if: always()
        run: ls -la allure-results/ || echo "La carpeta allure-results no existe"

      - name: Generar reporte de Allure
        if: always()
        run: |
          npm install -g allure-commandline --no-fund --no-audit
          npx allure generate allure-results --clean -o allure-report

      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15
          