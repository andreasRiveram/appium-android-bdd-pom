name: Appium Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de Cucumber a ejecutar (ej: @smoke, @regression)'
        required: true
        default: '@smoke'
        type: string

jobs:
  test-android:
    runs-on: macos-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Levantar emulador y ejecutar tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          script: |
            adb wait-for-device
            adb devices
            npm install -g appium
            appium driver install uiautomator2
            appium --allow-insecure=uiautomator2:adb_shell &
            sleep 10
            npx wdio run wdio.conf.js --cucumberOpts.tagExpression="${{ github.event.inputs.tag || '@smoke' }}"

      - name: Generar reporte de Allure
        if: always()
        run: |
          npm install -g allure-commandline
          npx allure generate allure-results --clean -o allure-report

      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15